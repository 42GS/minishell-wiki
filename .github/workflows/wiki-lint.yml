name: Wiki Health Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: wiki-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wiki-lint:
    name: Wiki Health Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Wiki
        uses: actions/checkout@v4

      - name: Run Comprehensive Wiki Linter
        run: |
          python3 scripts/lint_wiki.py
