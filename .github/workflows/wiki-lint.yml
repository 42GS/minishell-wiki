name: Wiki Health Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  wiki-lint:
    name: Wiki Health Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Wiki
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Comprehensive Wiki Linter
        run: |
          python3 scripts/lint_wiki.py
