name: Minishell CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  norminette:
    name: Norminette Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Norminette
        run: |
          python -m pip install --upgrade pip
          pip install norminette

      - name: Run Norminette
        run: |
          norminette src/ include/

  build_and_test:
    name: Strict Build & Test
    runs-on: ubuntu-latest
    needs: norminette
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreadline-dev valgrind

      - name: Build Mandatory
        run: |
          make all

      - name: Check Makefile Relink
        run: |
          make all | grep -v "Nothing to be done" && echo "Relink detected!" && exit 1 || echo "No relink confirmed"

      - name: Build Bonus
        run: |
          make bonus

      - name: Run Valgrind Leak Test
        run: |
          valgrind --leak-check=full --show-leak-kinds=all --track-fds=yes --error-exitcode=42 ./minishell -c "echo hello | cat" || test $? -eq 0
