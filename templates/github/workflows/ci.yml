name: Minishell CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  norminette:
    name: Norminette Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Norminette
        run: |
          python -m pip install --upgrade pip
          pip install norminette

      - name: Run Norminette
        run: |
          norminette src/ include/ libft/

  build_and_test:
    name: Strict Build & Leak Verification
    runs-on: ubuntu-latest
    needs: norminette
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreadline-dev valgrind

      - name: Build Mandatory (-Wall -Wextra -Werror)
        run: |
          make all

      - name: Verify No-Relink (make all)
        run: |
          out=$(make all)
          echo "$out"
          echo "$out" | grep -q "Nothing to be done" || (echo "Relink detected on make all!" && exit 1)

      - name: Build Bonus & Verify No-Relink (make bonus)
        run: |
          make bonus
          out=$(make bonus)
          echo "$out"
          echo "$out" | grep -q "Nothing to be done" || (echo "Relink detected on make bonus!" && exit 1)

      - name: Verify Clean & Rebuild Rules (fclean / re)
        run: |
          make fclean
          if [ -f minishell ] || [ -f libft/libft.a ] || [ -d obj ]; then
            echo "Clean rule left build artifacts behind!"
            exit 1
          fi
          make re

      - name: Run Automated Unit Tests (with Valgrind)
        run: |
          bash tests/unit/run_unit.sh

      - name: Run Automated E2E Smoke Tests
        run: |
          python3 tests/e2e/run_e2e.py --ci

      - name: Run Valgrind Memory & FD Leak Check
        run: |
          valgrind \
            --leak-check=full \
            --show-leak-kinds=all \
            --errors-for-leak-kinds=all \
            --track-fds=yes \
            --suppressions=tests/readline.supp \
            --error-exitcode=42 \
            ./minishell < /dev/null
